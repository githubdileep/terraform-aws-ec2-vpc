name: Terraform VPC + EC2

on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - ".github/workflows/terraform.yml"
      - "iam/**.json"
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - ".github/workflows/terraform.yml"
      - "iam/**.json"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write   # required for OIDC auth to AWS
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.1"
  AWS_REGION: "us-east-1"

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          # Sanitize secrets: strip CR/LF and leading/trailing whitespace so a
          # stray newline copied into a GitHub secret can't corrupt the S3 URI.
          bucket="$(printf '%s' "$TF_STATE_BUCKET" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          lock_table="$(printf '%s' "$TF_LOCK_TABLE" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"

          terraform init \
            -backend-config="bucket=$bucket" \
            -backend-config="key=terraform-aws-ec2-vpc/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=$lock_table"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        env:
          KEY_PAIR_NAME: ${{ secrets.KEY_PAIR_NAME }}
        run: |
          key_pair_name="$(printf '%s' "$KEY_PAIR_NAME" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"

          terraform plan -no-color -out=tfplan \
            -var="key_pair_name=$key_pair_name"
        continue-on-error: true

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "Terraform plan exit code: `${{ steps.plan.outcome }}`. Check the Actions run for full plan output."
            })

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event.inputs.action == 'apply' || github.event_name == 'push')
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        env:
          KEY_PAIR_NAME: ${{ secrets.KEY_PAIR_NAME }}
        run: |
          key_pair_name="$(printf '%s' "$KEY_PAIR_NAME" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"

          terraform destroy -auto-approve \
            -var="key_pair_name=$key_pair_name"
